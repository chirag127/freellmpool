<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" aria-labelledby="title desc" role="img" viewBox="0 0 1200 630"><title id="title">freellmpool tokenmax launch card</title><desc id="desc">Static launch card showing 177 enabled chat routes, 22 cataloged providers, zero-dollar gateway software, conditional keyless start, and automatic failover.</desc><defs><style>.bg{fill:#f7fafc}.ink{fill:#102033;font-family:&quot;DejaVu Sans&quot;}.muted{fill:#5e718d}.card{fill:#fff;stroke:#d8e1ee;stroke-width:2}.metric{font-size:76px;font-weight:800}.label{font-size:25px;font-weight:700}.small{font-size:24px}.tiny{font-size:20px}</style></defs><rect width="1200" height="630" class="bg"/><text x="70" y="88" class="ink" style="font-size:44px;font-weight:800">freellmpool tokenmax</text><text x="70" y="128" class="ink muted small">A local OpenAI-compatible pool over legitimate free tiers.</text><rect width="320" height="220" x="70" y="178" class="card" rx="18"/><text x="104" y="292" class="ink metric">177</text><text x="108" y="340" class="ink label">enabled chat routes</text><text x="108" y="374" class="ink muted tiny">431 cataloged chat models</text><rect width="320" height="220" x="440" y="178" class="card" rx="18"/><text x="474" y="292" class="ink metric">22</text><text x="478" y="340" class="ink label">cataloged providers</text><text x="478" y="374" class="ink muted tiny">Pollinations, OVHcloud, Groq...</text><rect width="320" height="220" x="810" y="178" class="card" rx="18"/><text x="844" y="292" class="ink metric">$0</text><text x="848" y="340" class="ink label">keyless start</text><text x="848" y="374" class="ink muted tiny">when available</text><rect width="1060" height="104" x="70" y="448" class="card" rx="18"/><text x="108" y="512" class="ink small">tokenmax fans one prompt across free models and shows every answer side-by-side.</text><text x="108" y="542" class="ink muted tiny">Automatic failover on rate limits, timeouts, 5xx, empty replies, and transport errors.</text></svg>